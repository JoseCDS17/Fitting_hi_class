[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "horndeski_template"
version = "0.1.0"
description = "Analytic template for P_MG/P_GR - 1 in Horndeski models on w0wa backgrounds, without running CLASS"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools]
packages = ["horndeski_template"]

[tool.setuptools.package-data]
horndeski_template = ["coefficients.json"]
